<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>AUREL Pricing</title><style>:root{--bg:#05070d;--panel:#0b1020;--panel2:#111a33;--text:#f6f4ed;--muted:#9aa7bd;--cyan:#66e8ff;--gold:#d8b76a;--line:rgba(255,255,255,.14);--bad:#ff6b6b;--good:#5cffb1}*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,rgba(102,232,255,.14),transparent 28rem),radial-gradient(circle at bottom right,rgba(216,183,106,.1),transparent 30rem),var(--bg);color:var(--text);margin:0;line-height:1.62}main{width:min(1220px,94vw);margin:auto;padding:26px 0 100px}.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(18px);background:rgba(5,7,13,.78);border-bottom:1px solid var(--line);padding:12px 0}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav a,.chip{color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 12px;text-decoration:none;background:rgba(255,255,255,.04)}.hero,.card{border:1px solid var(--line);border-radius:30px;padding:28px;background:linear-gradient(180deg,rgba(17,26,51,.94),rgba(11,16,32,.9));box-shadow:0 30px 90px rgba(0,0,0,.38);margin:18px 0}.hero h1{font-size:clamp(3rem,9vw,7.4rem);line-height:.86;letter-spacing:-.08em;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}h2{font-size:clamp(1.6rem,4vw,3rem);letter-spacing:-.05em}p{color:var(--muted);font-size:1.05rem}a{color:var(--cyan)}button,.button{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(90deg,var(--gold),#f5da8c);color:#111;font-weight:900;border:0;border-radius:999px;padding:13px 17px;cursor:pointer;text-decoration:none;margin:4px 4px 4px 0}.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line)}input,textarea,select{width:100%;padding:14px;border-radius:18px;border:1px solid var(--line);background:#050812;color:var(--text);margin:8px 0;font:inherit}label{display:block;color:var(--muted);margin-top:10px}pre{white-space:pre-wrap;background:#050812;border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--muted);overflow:auto}.status{display:inline-block;border-radius:999px;padding:6px 10px;border:1px solid var(--line);color:var(--muted)}.ok{color:var(--good)}.bad{color:var(--bad)}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.suggestions button{background:rgba(102,232,255,.1);color:var(--cyan);border:1px solid rgba(102,232,255,.25)}@media(max-width:900px){main{width:min(96vw,760px)}.grid,.grid2{grid-template-columns:1fr}.hero,.card{border-radius:22px;padding:20px}.nav{overflow:auto;flex-wrap:nowrap}.nav a{white-space:nowrap}.hero h1{font-size:clamp(2.8rem,15vw,5rem)}}</style></head><body><div class='top'><main style='padding:0'><div class='nav'><strong>AUREL</strong><a href='./index.html'>Home</a><a href='./chat.html'>Voice Chat</a><a href='./builder.html'>Builder</a><a href='./automation.html'>Automation</a><a href='./pricing.html'>Pricing</a><a href='./status.html'>Status</a></div></main></div><main><section class='card'><h1>Pricing</h1><p>Owner-approved before checkout.</p></section></main></body></html>
