name: Repository Integrity Gate
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git whitespace check
        run: git diff --check
      - name: Reject tracked secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=""
          while IFS= read -r path; do
            base="${path##*/}"
            case "$base" in
              .env|.env.local|.env.production|.env.development|.env.staging|.env.*.local|.env.*.production|.env.*.development)
                forbidden+="$path"$'\n'
                ;;
              .env.*)
                case "$base" in
                  .env.template|.env.example|.env.sample) ;;
                  *) forbidden+="$path"$'\n' ;;
                esac
                ;;
              *.pem|*.key|credentials.json)
                forbidden+="$path"$'\n'
                ;;
            esac
          done < <(git ls-files)
          if [ -n "$forbidden" ]; then
            echo "::error::Potential secret-bearing files are tracked:"
            printf '%s' "$forbidden"
            exit 1
          fi
      - name: Repository gate result
        run: echo "PASS — repository integrity checks completed."
