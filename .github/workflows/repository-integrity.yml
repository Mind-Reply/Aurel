name: Repository Integrity Gate
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git whitespace check
        run: git diff --check
      - name: Reject tracked local environment files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tracked_files < <(git ls-files -z)
          forbidden=()
          for file in "${tracked_files[@]}"; do
            base="${file##*/}"
            case "$base" in
              .env.example|.env.template|.env.production.example|.env.development.example|.env.test.example)
                # Tracked templates are permitted only as examples with no real credentials.
                continue
                ;;
              .env|.env.*|*.pem|*.key|credentials.json)
                forbidden+=("$file")
                ;;
            esac
          done
          if (("${#forbidden[@]}" > 0)); then
            echo "::error::Potential secret-bearing files are tracked:"
            printf '%s\n' "${forbidden[@]}"
            exit 1
          fi
      - name: Repository gate result
        run: echo "PASS — repository integrity checks completed."
